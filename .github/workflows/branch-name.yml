name: Branch name

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR head branch name
        run: |
          chmod +x scripts/check-branch-name.sh
          scripts/check-branch-name.sh "${{ github.head_ref }}"
