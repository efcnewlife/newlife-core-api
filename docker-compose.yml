services:
  db:
    image: postgres:18
    container_name: newlife-postgres
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - ".tmp/pg18/data:/var/lib/postgresql"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
  redis:
    image: redis:latest
    container_name: newlife-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ".tmp/redis/data:/data"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
